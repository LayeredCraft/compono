name: Package Validation

# Locally-controlled pre-merge PR gate for the ADR-0031 package-readiness bar
# (PLAN-0008 Phase 0) - distinct from publish-preview.yaml/publish-release.yaml,
# which are single-job, opaque `uses:` calls to the shared devops-templates
# workflow with no step-level hook to insert this sequence into. Must include
# labeled/unlabeled activity types (not just pr-build.yaml's default set) -
# release-drafter.yaml applies the breaking-change autolabel in its own,
# separately-triggered run, so a gate that only reads labels at the PR's
# initial push can run before the label exists or stay green after it's later
# removed. The `github.event.pull_request.labels` expression below always
# reflects this job's own current trigger, never a cached value from an
# earlier run.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  package-validation:
    runs-on: ubuntu-latest
    env:
      # ADR-0031's 0.X+1.0 policy already permits a labeled breaking-change PR to
      # break API compatibility - failing the same PR on the incompatibility the
      # label declares would be a self-contradiction, so only the baseline
      # compatibility check below is skipped, not packing/content-inspection/
      # CS1591 enforcement.
      BREAKING_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'breaking-change') }}
      PACK_OUTPUT: ${{ github.workspace }}/artifacts/package-validation
      # Single authoritative publishable-package list (PLAN-0061 Phase 1) - the baseline-lookup and
      # pack steps below both derive from this one job-level env var instead of each repeating the
      # same 11-package literal, so adding/removing a package can't drift across the two
      # independently. A job-level `env:` entry is injected into every step's own
      # process environment by GitHub Actions itself, so this survives across the separate `run:`
      # steps below (each its own shell process) with no extra plumbing - deliberately not a Bash
      # array, which would only live for the one step that declared it.
      PACKAGES: "Compono Compono.XunitV3 Compono.NSubstitute Compono.Bogus Compono.TUnit Compono.TestDoubles Compono.DependencyInjection Compono.Http Compono.Logging Compono.MSTest Compono.NUnit Compono.Options"
    steps:
      - uses: actions/checkout@v7

      # The 11.0 entry below is exact-pinned, not a floating "11.0.x" - a floating request lets
      # setup-dotnet install whatever preview/rc build is currently newest in the 11.0 channel, which
      # combines with global.json's rollForward:latestFeature to make MSBuild silently prefer that
      # newer SDK over the one global.json actually pins. Reproduced: 11.0.100-rc.1.26425.128 broke
      # the NUnit compatibility matrix's classic-VSTest leg (module initializer failed to register
      # Widget's row-binding dispatch, "No row-binding dispatch is registered for Widget") while the
      # exact SDK global.json pins (preview.7.26381.103) runs it correctly - confirmed by diffing this
      # job's SDK-install log against the last known-good run's. Bump this in lockstep with
      # global.json's own sdk.version, never independently.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.100-preview.7.26381.103

      - name: Restore
        run: dotnet restore Compono.slnx

      - name: Resolve nuget.org baseline versions
        run: |
          set -euo pipefail
          for pkg in $PACKAGES; do
            id_lower=$(echo "$pkg" | tr '[:upper:]' '[:lower:]')
            # No -f here: a non-2xx response must still reach the status-code branch
            # below (curl -f suppresses the body/short-circuits on HTTP errors), and
            # only a *confirmed* 404 means "never published" - a transport-level
            # failure (DNS, timeout, connection refused) is the one case that should
            # still hard-fail the job rather than silently disabling the compatibility
            # gate below.
            response=$(curl -s -w '\n%{http_code}' "https://api.nuget.org/v3-flatcontainer/${id_lower}/index.json") || {
              echo "::error::Failed to reach nuget.org for ${pkg}'s baseline lookup (network/transport failure) - failing rather than silently treating this as a first publish." >&2
              exit 1
            }
            status="${response##*$'\n'}"
            body="${response%$'\n'*}"
            if [ "$status" = "200" ]; then
              # The currently-latest published version, prerelease or not - Compono is
              # still 0.x/prerelease-only today, and that's genuinely what's "currently
              # published" to diff a compatibility baseline against.
              version=$(echo "$body" | jq -r '.versions | last // empty')
            elif [ "$status" = "404" ]; then
              # The only legitimate "nothing to compare against yet" case: this
              # package has genuinely never been published.
              version=""
            else
              echo "::error::nuget.org baseline lookup for ${pkg} returned HTTP ${status}, not 200 or a confirmed 404 (e.g. rate-limited or a transient 5xx) - failing rather than silently skipping the API-compatibility gate." >&2
              exit 1
            fi
            env_name="BASELINE_$(echo "$pkg" | tr '.' '_')"
            echo "${env_name}=${version}" >> "$GITHUB_ENV"
            echo "${pkg} nuget.org baseline: ${version:-<none, first publish>}"
          done

      - name: Pack publishable packages
        run: |
          set -euo pipefail
          mkdir -p "$PACK_OUTPUT"

          pack_one() {
            local csproj="$1"
            local baseline_env="$2"
            local baseline="${!baseline_env:-}"
            local args=()
            # Pin this validation-only pack's own Version to the nuget.org baseline (never
            # published - PACK_OUTPUT never leaves this job) whenever one exists. Without this,
            # an unversioned `dotnet pack` always defaults to 1.0.0.0, which fails ApiCompat's
            # CP0003 ("assembly version should be equal to or higher than baseline") the moment
            # the real published baseline crosses 1.0.0 - as happened once 1.1.0-preview.103 was
            # published, breaking every subsequent PR's package-validation regardless of content.
            # Equal-to-baseline (not higher) is deliberate: this step only needs ApiCompat to run
            # its actual signature-diff (additions are never flagged; only removals/incompatible
            # changes are), not to assert a specific real version bump - that's computed by the
            # separate publish-preview.yaml/publish-release.yaml pipelines at actual publish time.
            if [ -n "$baseline" ]; then
              args+=("-p:Version=${baseline}")
            fi
            if [ "$BREAKING_CHANGE" != "true" ] && [ -n "$baseline" ]; then
              args+=("-p:PackageValidationBaselineVersion=${baseline}")
            fi
            echo "Packing $csproj ${args[*]:-<no baseline>}"
            dotnet pack "$csproj" -c Release -o "$PACK_OUTPUT" "${args[@]}"
          }

          for pkg in $PACKAGES; do
            pack_one "src/$pkg/$pkg.csproj" "BASELINE_$(echo "$pkg" | tr '.' '_')"
          done

      - name: Test inspect-packed-nupkgs.sh itself
        # Regression coverage for issue #122 (dependency-range-literal drift) -
        # runs before the real inspection below so a broken validator fails
        # fast with its own diagnostic, not a confusing downstream mismatch.
        run: .github/scripts/inspect-packed-nupkgs.tests.sh

      - name: Inspect packed .nupkg contents
        run: .github/scripts/inspect-packed-nupkgs.sh "$PACK_OUTPUT"

      - name: Local-feed packed-consumer smoke test
        # Reuses test/Compono.XunitV3.SampleTests' own PackToLocalFeed restore
        # (packs current source, not this job's Release artifacts above, into
        # .local-nuget-feed and restores the four publishable packages from
        # there as a real consumer would) - filtered to exclude every class
        # whose name starts with "Failing" (FailingCompositionTests,
        # FailingConfigProfileTests, and any future one following the same
        # naming convention), each of which fails by design per ADR-0022's
        # Testing Strategy and is why this project is deliberately not in
        # Compono.slnx (docs/plans/0004-milestone-4-xunit-integration.md). A
        # single wildcarded --filter-not-class covers the whole naming
        # convention rather than needing a new literal class name added here
        # every time a new deliberately-failing proof test is added (PR #65
        # review: a non-wildcarded, single-class filter here is exactly what
        # broke this job when FailingConfigProfileTests' predecessor test was
        # first added inside an otherwise-green class instead). The wildcard
        # must be trailing-only ("Failing*", not "Failing*Tests") - the MTP
        # CLI rejects a wildcard placed in the middle of a filter expression
        # ("wildcards may only be at the beginning and/or end"), confirmed
        # directly against the built test host.
        # Runs from the project's own directory, not a relative path from the repo root - a
        # `dotnet test <relative-path>` invocation from outside the project directory hit a real,
        # reproduced dotnet SDK/Microsoft Testing Platform path-resolution bug under the current
        # 11.0.x preview SDK (the resolved project path gets the project's own relative directory
        # segment doubled, e.g. `test/X/test/X/X.csproj`) - confirmed locally against this exact
        # command and this exact project, unrelated to this project's own content. `working-directory`
        # plus a path-less `dotnet test` sidesteps it entirely (verified locally: all 4 TFMs restore/
        # build/run correctly this way).
        working-directory: test/Compono.XunitV3.SampleTests
        run: |
          dotnet test -c Release \
            -- --filter-not-class "Compono.XunitV3.SampleTests.Failing*"

      - name: Local-feed packed-consumer smoke test (Compono.TUnit)
        # Same reasoning as the xUnit v3 step above (own PackToLocalFeed restore, packs current
        # source into .local-nuget-feed, restores as a real consumer would) - no deliberately-failing
        # proof tests exist in this project yet, so no --filter-not-class is needed.
        # See the Compono.XunitV3 step's own comment above for why this runs from the project's
        # own directory rather than a relative path from the repo root.
        working-directory: test/Compono.TUnit.SampleTests
        run: |
          dotnet test -c Release

      - name: Local-feed packed-consumer smoke test (Compono.MSTest)
        # Same reasoning as the xUnit v3 step above (own PackToLocalFeed restore, packs current
        # source into .local-nuget-feed, restores as a real consumer would) - no deliberately-failing
        # proof tests exist in this project yet, so no --filter-not-class is needed.
        # See the Compono.XunitV3 step's own comment above for why this runs from the project's
        # own directory rather than a relative path from the repo root.
        working-directory: test/Compono.MSTest.SampleTests
        run: |
          dotnet test -c Release

      - name: Local-feed packed-consumer smoke test (Compono.NUnit)
        # Same reasoning as the xUnit v3 step above (own PackToLocalFeed restore, packs current
        # source into .local-nuget-feed, restores as a real consumer would) - PLAN-0059 task group 8's
        # own real generated-plan-through-the-packaged-dependency-chain proof, including the
        # [TestCase]/[Values]/custom-IParameterDataSource independent-row coexistence scenario. No
        # deliberately-failing proof tests exist in this project either, so no --filter-not-class is
        # needed.
        # See the Compono.XunitV3 step's own comment above for why this runs from the project's
        # own directory rather than a relative path from the repo root.
        working-directory: test/Compono.NUnit.SampleTests
        run: |
          dotnet test -c Release

      - name: NUnit compatibility matrix (Compono.NUnit)
        # PLAN-0059 task group 9's permanent, repeatable, CI-blocking supported-version x runner
        # matrix (ADR-0059 §6's monitoring requirement for the accepted NUnit Internal-namespace
        # dependency risk): NUnit 3.14.0 (floor) and the current stable 4.x line, each under both
        # classic VSTest and MTP, each verifying the *resolved* NUnit assembly version from real
        # build output - see .github/scripts/nunit-compatibility-matrix.sh for the full mechanism.
        # NUnit 5 prerelease is deliberately excluded - non-blocking surveillance only.
        run: .github/scripts/nunit-compatibility-matrix.sh

      - name: Local-feed packed-consumer smoke test (Compono.TestDoubles)
        # Same reasoning as the xUnit v3 step above (own PackToLocalFeed restore, packs current
        # source into .local-nuget-feed, restores as a real consumer would) - PLAN-0043 Phase 2's own
        # real generated-double-through-the-packaged-dependency-chain proof. No deliberately-failing
        # proof tests exist in this project either, so no --filter-not-class is needed.
        # See the Compono.XunitV3 step's own comment above for why this runs from the project's
        # own directory rather than a relative path from the repo root.
        working-directory: test/Compono.TestDoubles.SampleTests
        run: |
          dotnet test -c Release
