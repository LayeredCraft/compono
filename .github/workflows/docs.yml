name: Deploy Documentation

# The API reference drift check (ADR-0032, PLAN-0008 Phase 1) runs as this
# workflow's own first real step, sequentially before `mkdocs build` - not a
# separate workflow with no ordering relationship to this one. Previously a
# standalone api-reference.yaml had no `needs`/`workflow_run` link to this
# workflow, so a failing drift check could never actually stop a bad deploy;
# folding it in here means the site build step below only ever runs against
# docs/reference/api content already confirmed fresh in the same job.
on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/Compono/**'
      - 'src/Compono.XunitV3/**'
      - 'src/Compono.NSubstitute/**'
      - 'src/Compono.Bogus/**'
      - 'src/Compono.TUnit/**'
      - 'src/Compono.TestDoubles/**'
      - 'src/Compono.DependencyInjection/**'
      - 'src/Compono.Http/**'
      - 'src/Compono.Logging/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - '.config/dotnet-tools.json'
      - '.github/scripts/generate-api-reference.sh'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/Compono/**'
      - 'src/Compono.XunitV3/**'
      - 'src/Compono.NSubstitute/**'
      - 'src/Compono.Bogus/**'
      - 'src/Compono.TUnit/**'
      - 'src/Compono.TestDoubles/**'
      - 'src/Compono.DependencyInjection/**'
      - 'src/Compono.Http/**'
      - 'src/Compono.Logging/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - '.config/dotnet-tools.json'
      - '.github/scripts/generate-api-reference.sh'
      - '.github/workflows/docs.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x

      - name: Restore
        run: dotnet restore Compono.slnx

      - name: Restore local tools
        run: dotnet tool restore

      - name: Build publishable packages (net10.0)
        run: |
          set -euo pipefail
          for pkg in Compono Compono.XunitV3 Compono.NSubstitute Compono.Bogus Compono.TUnit Compono.TestDoubles Compono.DependencyInjection Compono.Http Compono.Logging; do
            dotnet build "src/${pkg}/${pkg}.csproj" -c Release -f net10.0
          done

      - name: Regenerate API reference
        run: .github/scripts/generate-api-reference.sh

      - name: Fail on API reference drift
        run: |
          if ! git diff --exit-code -- docs/reference/api; then
            echo "::error::docs/reference/api is out of date. Run '.github/scripts/generate-api-reference.sh' (after building the eight publishable packages for net10.0 Release) and commit the result." >&2
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: pyproject.toml

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build documentation
        run: uv run mkdocs build --clean --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
