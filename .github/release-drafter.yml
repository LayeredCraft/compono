name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

autolabeler:
  - label: 'type: feat'
    title:
      - '/^feat(\(.+\))?(!)?:/i'
  - label: 'type: fix'
    title:
      - '/^fix(\(.+\))?(!)?:/i'
  - label: 'type: docs'
    title:
      - '/^docs(\(.+\))?(!)?:/i'
  - label: 'type: refactor'
    title:
      - '/^refactor(\(.+\))?(!)?:/i'
  - label: 'type: test'
    title:
      - '/^test(\(.+\))?(!)?:/i'
  - label: 'type: chore'
    title:
      - '/^chore(\(.+\))?(!)?:/i'
  - label: 'type: ci'
    title:
      - '/^ci(\(.+\))?(!)?:/i'
  - label: 'type: revert'
    title:
      - '/^revert(\(.+\))?(!)?:/i'
  - label: 'breaking-change'
    title:
      - '/^(feat|fix|docs|refactor|test|chore|ci|revert)(\([^)]*\))?!:/i'

categories:
  - type: 'pre-include'
    when:
      labels:
        - 'type: feat'
        - 'type: fix'
        - 'type: docs'
        - 'type: refactor'
        - 'type: test'
        - 'type: chore'
        - 'type: ci'
        - 'type: revert'
        - 'breaking-change'
  - type: 'pre-exclude'
    when:
      labels:
        - 'skip-changelog'
        - 'internal'
  - title: '⚠️ Breaking Changes'
    when:
      label: 'breaking-change'
  - title: '🚀 Features'
    when:
      label: 'type: feat'
  - title: '🐛 Bug Fixes'
    when:
      label: 'type: fix'
  - title: '📚 Documentation'
    when:
      label: 'type: docs'
  - title: '🔄 Refactoring'
    when:
      label: 'type: refactor'
  - title: '✅ Tests'
    when:
      label: 'type: test'
  - title: '🔧 Maintenance'
    when:
      labels:
        - 'type: chore'
        - 'type: ci'
        - 'type: revert'
  # ADR-0031 Amendment 5: Compono is ready to leave the 0.x preview line, so a
  # labeled breaking-change PR resolves an ordinary SemVer major bump again,
  # graduating to 1.0.0 (or beyond, for any later breaking change) whenever
  # one next merges - not a statement that 1.0 has already shipped. The
  # deliberate minor-bump override ADR-0031's original "0.x compatibility
  # policy" put in place (PLAN-0008 Phase 0) applied only while intentionally
  # staying on 0.x, and no longer applies now that that decision has been
  # made.
  - type: 'version-resolver'
    semver-increment: 'major'
    when:
      labels:
        - 'breaking-change'
  - type: 'version-resolver'
    semver-increment: 'minor'
    when:
      labels:
        - 'type: feat'
  - type: 'version-resolver'
    semver-increment: 'patch'
    when:
      labels:
        - 'type: fix'
        - 'type: docs'
        - 'type: refactor'
        - 'type: test'
        - 'type: chore'
        - 'type: ci'
        - 'type: revert'
  - type: 'version-resolver'
    semver-increment: 'patch'

template: |
  ## Summary

  SUMMARY_GOES_HERE

  ## Changes

  $CHANGES

commitish: 'main'
